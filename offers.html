<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>قائمة الأسعار | تأميني</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ============ الأساسيات ============ */
:root{
  --bg:#f4f7f9; --fg:#0e1b2a; --muted:#5b6b7c;
  --primary:#0fa295; --primary-dark:#0b8177; --primary-soft:#e3f7f4;
  --border:#e4e9ef; --card:#ffffff;
  --shadow-sm:0 2px 10px rgba(14,27,42,.06);
  --shadow-md:0 16px 38px -16px rgba(14,27,42,.22);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Tajawal',system-ui,sans-serif; background:var(--bg); color:var(--fg);
  line-height:1.65; -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
h1,h2,h3,p{margin:0;} ul{margin:0;padding:0;list-style:none;}
.hidden{display:none !important;}

/* ============ الهيدر ============ */
.site-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
.topbar{max-width:1180px;margin-inline:auto;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:900;font-size:1.25rem;}
.brand img{height:36px;width:auto;}

/* ============ شريط الخطوات ============ */
.step-header {text-align:center; padding: 2rem 1rem 1rem; background: #fff;}
.step-header h2 { font-size: 1.5rem; font-weight: 900; margin-bottom: 1rem;}
.step-indicator {display:flex; justify-content:center; gap:2rem; position:relative; max-width: 600px; margin: 0 auto;}
.step-indicator::before {content:''; position:absolute; top:12px; left:15%; right:15%; height:2px; background:var(--border); z-index:1;}
.step-dot {position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:.4rem; font-size:.8rem; font-weight:700; color:var(--muted);}
.step-dot .circle {width:26px; height:26px; border-radius:50%; background:var(--border); display:grid; place-items:center; transition:.3s;}
.step-dot.active {color:var(--primary);}
.step-dot.active .circle {background:var(--primary); box-shadow:0 0 0 4px var(--primary-soft); color: #fff;}
.step-dot.completed .circle {background:var(--primary); color:#fff;}

/* ============ صفحة الأسعار ============ */
.quotes-page {padding: 2rem 0 120px;}
.section-wrap{max-width:700px;margin-inline:auto;padding-inline:1.5rem;}
.page-banner {background: #0056b3; color: #fff; padding: 0.8rem; border-radius: 12px; text-align: center; font-weight: 700; margin-bottom: 1.5rem; font-size: 1.1rem;}

.quote-card {background:#fff; border-radius:20px; padding:1.5rem; margin-bottom:1.5rem; box-shadow:var(--shadow-sm); border:1px solid var(--border); display:flex; flex-direction:column; gap:1rem; position:relative;}
.promo-card {border: 2px solid #0056b3; box-shadow: 0 10px 30px rgba(0,86,179,.15); overflow: hidden;}

/* اللمعة (Shine Effect) */
.promo-card::after {
  content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0) 100%);
  transform: skewX(-25deg);
  animation: shine 4s infinite;
  pointer-events: none;
}
@keyframes shine {
  0% { left: -100%; }
  90% { left: 200%; }
  100% { left: 200%; }
}

.promo-header {background: #0056b3; color: #fff; padding: 0.6rem 1rem; margin: -1.5rem -1.5rem 1rem -1.5rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: 700;}
.promo-badge {
  background: #dc2626; color: #fff; padding: 0.3rem 1rem; border-radius: 99px; font-size: 0.85rem; font-weight: 800;
  animation: wiggle 2.5s ease-in-out infinite; /* الرجفة */
  display: inline-block;
}
@keyframes wiggle {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-6deg); }
  75% { transform: rotate(6deg); }
}

.timer-bar {background: rgba(220, 38, 38, 0.08); border-radius: 12px; padding: 0.6rem 1rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;}
.timer-text {color: #dc2626; font-weight: 700; font-size: 0.85rem;}
.timer-digits {display: flex; gap: 0.3rem; direction: ltr;}
.timer-digit {background: #dc2626; color: #fff; padding: 0.2rem 0.5rem; border-radius: 6px; font-weight: 800; font-size: 0.9rem;}

.quote-header {display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.5rem;}
.quote-logo-wrap {display: flex; align-items: center; gap: 0.8rem;}
.quote-logo-img {height: 50px; width: 60px; object-fit: contain; background: #f8f9fa; border-radius: 12px; padding: 0.3rem;}
.quote-company-name {font-weight: 800; font-size: 1.1rem; color: var(--fg); display: block;}
.quote-type-badge {background: #e3f7f4; color: var(--primary-dark); padding: 0.2rem 0.6rem; border-radius: 99px; font-size: 0.75rem; font-weight: 700; display: inline-block; margin-top: 0.2rem;}

.quote-features {font-size:.9rem; color:var(--fg); line-height:1.8; margin-top: 0.5rem;}
.quote-features li {display: flex; gap: 0.4rem; align-items: flex-start; margin-bottom: 0.3rem;}
.quote-features .main-feature {background: #f0f7ff; padding: 0.5rem; border-radius: 8px; font-weight: 600; color: #0056b3;}
.quote-features .sub-feature {color: var(--muted); font-size: 0.85rem;}

.quote-footer {display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 0.5rem;}
.quote-price {text-align: left;}
.quote-price .old {text-decoration:line-through; color:var(--muted); font-size:.85rem;}
.quote-price .new {font-size:1.8rem; font-weight:900; color:#0056b3;}
.quote-price .tax {font-size:.75rem; color:var(--muted);}
.btn-select-offer {background: #0056b3; color: #fff; border: none; padding: 0.8rem 2rem; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s;}
.btn-select-offer:hover {background: #004494; transform: scale(1.02);}

/* ============ الأزرار الثابتة ============ */
.fixed-bottom-bar {position:fixed; bottom:0; left:0; right:0; background:#fff; padding:1rem 1.5rem; box-shadow:0 -4px 20px rgba(0,0,0,.05); z-index:100; display:flex; justify-content:center; gap: 1rem;}
.fixed-bottom-bar .btn {flex: 1; max-width: 300px; padding: 0.8rem; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; border: none;}
.btn-outline {background: #fff; color: var(--fg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: 0.3s;}
.btn-outline:hover {background: var(--primary); color: #fff; border-color: transparent;}

/* ============ Chat Widget ============ */
#chat-widget-container {position: fixed; bottom: 24px; left: 24px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-start; gap: 1rem;}
.chat-fab {width: 60px; height: 60px; border-radius: 50%; background: #0056b3; color: #fff; border: none; display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 20px rgba(0,86,179,0.3); transition: 0.3s;}
.chat-fab:hover { transform: scale(1.05); }
.chat-fab svg { width: 28px; height: 28px; }
.chat-window {width: 360px; height: 500px; background: #f8fbff; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e0eaff;}
.chat-header {background: #0056b3; color: #fff; padding: 1rem; display: flex; justify-content: space-between; align-items: center;}
.chat-header-info { display: flex; align-items: center; gap: 0.8rem; }
.chat-header-icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); display: grid; place-items: center; }
.chat-header-icon svg { width: 24px; height: 24px; }
.chat-header-text h4 { margin: 0; font-size: 1rem; }
.chat-header-text span { font-size: 0.75rem; color: #a0c4ff; display: flex; align-items: center; gap: 0.3rem; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: blinkDot 1.5s infinite; }
@keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.chat-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
.chat-body { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
.chat-welcome { background: #e0f2fe; padding: 1rem; border-radius: 12px; color: #0056b3; font-size: 0.9rem; font-weight: 600; text-align: center; }
.chat-form-group { margin-top: 1rem; }
.chat-form-group label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.3rem; color: #333; }
.chat-form-group input { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid #cce0ff; outline: none; font-family: inherit; }
.chat-form-group input:focus { border-color: #0056b3; }
.start-chat-btn { width: 100%; margin-top: 1rem; padding: 0.9rem; background: #0056b3; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
.start-chat-btn:hover { background: #004494; }
.chat-messages { display: flex; flex-direction: column; gap: 0.8rem; }
.chat-bubble { max-width: 80%; padding: 0.7rem 1rem; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; }
.chat-bubble.user { background: #0056b3; color: #fff; align-self: flex-start; border-bottom-right-radius: 4px; }
.chat-bubble.bot { background: #fff; color: #333; align-self: flex-end; border-bottom-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.chat-loading { display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: #0056b3; font-size: 0.85rem; font-weight: 600; margin-top: auto; padding: 0.5rem; }
.spinner { width: 16px; height: 16px; border: 2px solid #cce0ff; border-top-color: #0056b3; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.chat-footer { padding: 0.8rem; background: #fff; border-top: 1px solid #e0eaff; display: flex; gap: 0.5rem; }
.chat-footer input { flex: 1; padding: 0.7rem; border-radius: 20px; border: 1px solid #cce0ff; outline: none; font-family: inherit; }
.chat-footer input:focus { border-color: #0056b3; }
.send-btn { width: 40px; height: 40px; border-radius: 50%; background: #0056b3; color: #fff; border: none; display: grid; place-items: center; cursor: pointer; transition: 0.3s; }
.send-btn:hover { background: #004494; }
.send-btn svg { width: 18px; height: 18px; }

/* Toast */
.toast-msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #dcfce7; color: #166534; padding: 1rem 1.5rem; border-radius: 12px; font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 0.5rem; z-index: 10000; animation: slideDown 0.3s ease-out; }
@keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }

@media (max-width: 560px) {
  .chat-window { width: calc(100vw - 40px); left: 20px; }
  .step-indicator { gap: 1rem; }
  .step-dot span { font-size: 0.7rem; }
}
</style>
</head>
<body>

<!-- الهيدر -->
<header class="site-header">
  <div class="topbar">
    <a class="brand" href="#">
      <img src="https://tamminyy.lovable.app/assets/tameeni-icon-BHVui6sK.svg" alt="تأميني" />
      <span>تأميني</span>
    </a>
  </div>
</header>

<!-- شريط الخطوات -->
<div class="step-header">
  <h2>قائمة الأسعار</h2>
  <div class="step-indicator">
    <div class="step-dot completed"><div class="circle">✓</div><span>البيانات</span></div>
    <div class="step-dot completed"><div class="circle">✓</div><span>التأمين</span></div>
    <div class="step-dot active"><div class="circle">3</div><span>الأسعار</span></div>
    <div class="step-dot"><div class="circle">4</div><span>الدفع</span></div>
  </div>
</div>

<!-- المحتوى -->
<div class="quotes-page">
  <div class="section-wrap">
    <div class="page-banner">عروض التأمين ضد الغير</div>
    <div id="quotes-container">
      <!-- سيتم توليد الكروت هنا عن طريق الجافاسكريبت -->
    </div>
  </div>
</div>

<!-- الأزرار السفلية -->
<div class="fixed-bottom-bar">
  <button class="btn btn-outline" onclick="alert('العودة للصفحة السابقة')">السابق (تعديل البيانات)</button>
</div>

<!-- Chat Widget -->
<div id="chat-widget-container">
  <button class="chat-fab" onclick="toggleChat()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </button>
  
  <div id="chat-window" class="chat-window hidden">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-header-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div class="chat-header-text">
          <h4>خدمة العملاء</h4>
          <span><span class="status-dot"></span> متصل الآن</span>
        </div>
      </div>
      <button class="chat-close" onclick="toggleChat()">&times;</button>
    </div>
    
    <div class="chat-body" id="chat-body">
      <div id="chat-welcome">
        <p class="chat-welcome">مرحبًا بك! 👋 أدخل اسمك ورقم جوالك لبدء المحادثة مع فريق الدعم</p>
        <div class="chat-form-group">
          <label>الاسم</label>
          <input type="text" id="chat-name" placeholder="اسمك الكريم">
        </div>
        <div class="chat-form-group">
          <label>رقم الجوال</label>
          <input type="tel" id="chat-phone" placeholder="05xxxxxxxx">
        </div>
        <button class="start-chat-btn" onclick="startChat()">بدء المحادثة</button>
      </div>
      
      <div id="chat-messages" class="chat-messages hidden"></div>
      
      <div id="chat-loading" class="chat-loading hidden">
        <div class="spinner"></div>
        <span>من فضلك الانتظار، يتم التحقق من أحد ممثلي الخدمة...</span>
      </div>
    </div>
    
    <div class="chat-footer hidden" id="chat-footer">
      <button class="send-btn" onclick="sendChatMessage()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
      <input type="text" id="chat-input" placeholder="اكتب رسالتك..." onkeypress="handleChatEnter(event)">
    </div>
  </div>
</div>

<script>
/* ================== بيانات العروض ================== */
const LOGO_BASE = "https://tamminyy.lovable.app/assets";

const quotesData = [
  { company: "تكافل الراجحي", logo: "rajhi-DNFw8gfN.svg", price: 515.50, oldPrice: 687.33, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال", "+ تغطية الحوادث الشخصية للسائق والركاب (50 ر.س)", "+ المساعدة على الطريق (30 ر.س)", "+ تغطية ضد كسر الزجاج والحرائق والسرقة (150 ر.س)"] },
  { company: "ميدغلف", logo: "medgulf-VIc-g1on.svg", price: 690.37, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال"] },
  { company: "ليفا للتأمين", logo: "liva-5_u4u5sU.svg", price: 730.77, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال"] },
  { company: "ولاء للتأمين", logo: "walaa-Dtbi7hFI.svg", price: 750.00, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال", "+ المساعدة على الطريق (50 ر.س)"] },
  { company: "ولاء", logo: "walaa-Dtbi7hFI.svg", price: 937.48, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال"] },
  { company: "العربية للتأمين", logo: "arabia-C8NtWg5_.svg", price: 938.30, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال", "+ تغطية الحوادث الشخصية للسائق فقط (50 ر.س)"] },
  { company: "الإتحاد للتأمين", logo: "alettihad-yaG8RB8I.svg", price: 943.17, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال"] },
  { company: "الاتحاد الخليجي", logo: "gulf-union-CUZE2AUy.svg", price: 977.33, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال"] },
  { company: "سلامة", logo: "salama-DW3cMajK.svg", price: 995.04, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال"] },
  { company: "بروج", logo: "buruj-D5-rqROz.svg", price: 1053.32, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال", "+ تغطية الحوادث الشخصية للسائق فقط (70 ر.س)"] },
  { company: "التعاونية", logo: "tawuniya-Dcj8KaEy.svg", price: 1074.96, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال", "+ تغطية الحوادث الشخصية للسائق فقط (60 ر.س)"] },
  { company: "أسيج", logo: "aseeg-DVTEvRRj.svg", price: 1098.95, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال"] },
  { company: "جي آي جي", logo: "gig-BVAtYPLn.svg", price: 1190.42, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال", "+ الاصابات الجسدية للغير"] },
  { company: "الصقر للتأمين", logo: "saqr-Dfhh_NYE.svg", price: 1288.70, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال"] },
  { company: "أليانز", logo: "allianz-BxGIDl-G.svg", price: 1455.80, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال"] },
  { company: "الدرع العربي", logo: "arabian-shield-Bco5WbKI.svg", price: 1506.96, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال", "+ تغطية الحوادث الشخصية للسائق فقط (60 ر.س)"] },
  { company: "الخليج العامة", logo: "gulf-general-_LQDNdKn.svg", price: 1673.40, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال", "+ تغطية الحوادث الشخصية للسائق فقط (40 ر.س)"] },
  { company: "التعاونية (شامل)", logo: "tawuniya-Dcj8KaEy.svg", price: 1799.95, oldPrice: null, features: ["تغطية شاملة حتى 10,000 ريال سعودي"] },
  { company: "أمانة", logo: "amana-DyEmoByC.svg", price: 2179.84, oldPrice: null, features: ["المسؤولية المدنية تجاه الغير بحد أقصى 10,000,000 ريال", "+ الوفاة و الاصابة الجسدية (50 ر.س)"] }
];

let timerInterval = null;

/* ================== رسم الكروت ================== */
function renderQuotes() {
  const container = document.getElementById('quotes-container');
  let html = '';
  
  quotesData.forEach((q, index) => {
    const isFirst = index === 0;
    const logoUrl = `${LOGO_BASE}/${q.logo}`;

    html += `
      <div class="quote-card ${isFirst ? 'promo-card' : ''}">
        
        ${isFirst ? `
        <div class="promo-header">
          <span>🔥 العرض الأقوى اليوم</span>
          <span class="promo-badge">خصم 25%</span>
        </div>
        <div class="timer-bar">
          <span class="timer-text">⏰ لمدة ساعتان فقط</span>
          <div class="timer-digits" id="countdown-timer">
            <span class="timer-digit" id="timer-h">01</span> :
            <span class="timer-digit" id="timer-m">59</span> :
            <span class="timer-digit" id="timer-s">59</span>
          </div>
        </div>
        ` : ''}

        <div class="quote-header">
          <div class="quote-logo-wrap">
            <img src="${logoUrl}" class="quote-logo-img" alt="${q.company}">
            <div>
              <span class="quote-company-name">${q.company}</span>
              <span class="quote-type-badge">ضد الغير</span>
            </div>
          </div>
        </div>
        
        <ul class="quote-features">
          ${q.features.map((f, i) => `
            <li class="${i === 0 ? 'main-feature' : 'sub-feature'}">
              ${i === 0 ? '✓' : '+'} ${f}
            </li>
          `).join('')}
        </ul>

        <div class="quote-footer">
          <div class="quote-price">
            ${q.oldPrice ? `<div class="old">${q.oldPrice} ر.س</div>` : ''}
            <div class="new" style="${isFirst ? 'color:#0056b3;' : ''}">${q.price.toFixed(2)} <span style="font-size:.9rem">ر.س</span></div>
            <div class="tax">شامل الضريبة</div>
          </div>
          <button class="btn-select-offer" onclick="alert('تم اختيار عرض ${q.company}')">اختيار</button>
        </div>

      </div>
    `;
  });
  
  container.innerHTML = html;
  
  if(quotesData.length > 0 && quotesData[0].oldPrice) {
    startTimer();
  }
}

/* ================== العداد التنازلي ================== */
function startTimer() {
  if(timerInterval) clearInterval(timerInterval);
  let totalSeconds = 2 * 60 * 60; 
  
  timerInterval = setInterval(() => {
    totalSeconds--;
    if(totalSeconds < 0) clearInterval(timerInterval);
    
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    
    const hEl = document.getElementById('timer-h');
    const mEl = document.getElementById('timer-m');
    const sEl = document.getElementById('timer-s');
    
    if(hEl) hEl.innerText = String(h).padStart(2, '0');
    if(mEl) mEl.innerText = String(m).padStart(2, '0');
    if(sEl) sEl.innerText = String(s).padStart(2, '0');
  }, 1000);
}

/* ================== الشات ================== */
let chatMessageCount = 0;
let chatStarted = false;

function toggleChat() {
  const chat = document.getElementById('chat-window');
  chat.classList.toggle('hidden');
}

function startChat() {
  const name = document.getElementById('chat-name').value;
  const phone = document.getElementById('chat-phone').value;
  if (!name || !phone) {
    alert('يرجى إدخال الاسم ورقم الجوال');
    return;
  }
  
  document.getElementById('chat-welcome').classList.add('hidden');
  document.getElementById('chat-messages').classList.remove('hidden');
  document.getElementById('chat-footer').classList.remove('hidden');
  
  showToast('مرحبًا بك! يمكنك إرسال رسائلك الآن');
}

function sendChatMessage() {
  if (chatMessageCount >= 4) return;
  
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  input.value = '';
  chatMessageCount++;

  document.getElementById('chat-loading').classList.remove('hidden');
  document.getElementById('chat-body').scrollTop = document.getElementById('chat-body').scrollHeight;

  setTimeout(() => {
    document.getElementById('chat-loading').classList.add('hidden');
    addMessage('شكراً لتواصلك، أحد ممثلينا سيرد عليك قريباً.', 'bot');
    
    if (chatMessageCount >= 4) {
      input.disabled = true;
      input.placeholder = 'تم الوصول للحد الأقصى من الرسائل';
      document.querySelector('.send-btn').style.opacity = '0.5';
    }
  }, 2000);
}

function addMessage(text, sender) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `chat-bubble ${sender}`;
  div.innerText = text;
  msgs.appendChild(div);
  document.getElementById('chat-body').scrollTop = document.getElementById('chat-body').scrollHeight;
}

function handleChatEnter(e) {
  if (e.key === 'Enter') {
    sendChatMessage();
  }
}

function showToast(message) {
  const toast = document.createElement('div');
  toast.className = 'toast-msg';
  toast.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> ${message}`;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'slideDown 0.3s ease-in reverse';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

/* ================== التشغيل ================== */
document.addEventListener('DOMContentLoaded', () => {
  renderQuotes();
});
